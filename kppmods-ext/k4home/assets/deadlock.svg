<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <!-- Original drawing: two processes, each holding the lock the other one waits for. -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Process A (left): boxy robot -->
  <g stroke="#000" stroke-width="8" fill="#fff" stroke-linejoin="round">
    <rect x="70" y="150" width="190" height="170" rx="22"/>
    <rect x="110" y="70" width="110" height="80" rx="16"/>
    <line x1="165" y1="70" x2="165" y2="38"/>
    <circle cx="165" cy="30" r="10" fill="#000"/>
    <line x1="100" y1="320" x2="100" y2="390"/>
    <line x1="230" y1="320" x2="230" y2="390"/>
    <line x1="75" y1="390" x2="125" y2="390"/>
    <line x1="205" y1="390" x2="255" y2="390"/>
  </g>
  <!-- A's face: impatient -->
  <g stroke="#000" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="138" y1="98" x2="152" y2="104"/>
    <line x1="192" y1="104" x2="178" y2="98"/>
    <line x1="140" y1="128" x2="190" y2="128"/>
  </g>
  <circle cx="145" cy="112" r="6" fill="#000"/>
  <circle cx="185" cy="112" r="6" fill="#000"/>

  <!-- Process B (right): round robot -->
  <g stroke="#000" stroke-width="8" fill="#fff" stroke-linejoin="round">
    <ellipse cx="795" cy="235" rx="100" ry="90"/>
    <circle cx="795" cy="105" r="48"/>
    <line x1="760" y1="320" x2="745" y2="390"/>
    <line x1="830" y1="320" x2="845" y2="390"/>
    <line x1="720" y1="390" x2="770" y2="390"/>
    <line x1="820" y1="390" x2="870" y2="390"/>
  </g>
  <!-- B's face: equally stubborn -->
  <g stroke="#000" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="770" y1="88" x2="784" y2="94"/>
    <line x1="820" y1="94" x2="806" y2="88"/>
    <path d="M772 128 q23 -14 46 0"/>
  </g>
  <circle cx="777" cy="104" r="6" fill="#000"/>
  <circle cx="813" cy="104" r="6" fill="#000"/>

  <!-- Lock 1, clutched by A -->
  <g stroke="#000" stroke-width="8" stroke-linejoin="round">
    <path d="M285 225 v-28 a32 32 0 0 1 64 0 v28" fill="none"/>
    <rect x="270" y="225" width="94" height="78" rx="10" fill="#000"/>
    <circle cx="317" cy="258" r="9" fill="#fff" stroke="none"/>
    <rect x="313" y="262" width="8" height="22" fill="#fff" stroke="none"/>
  </g>
  <line x1="255" y1="250" x2="272" y2="250" stroke="#000" stroke-width="10" stroke-linecap="round"/>

  <!-- Lock 2, clutched by B -->
  <g stroke="#000" stroke-width="8" stroke-linejoin="round">
    <path d="M613 225 v-28 a32 32 0 0 1 64 0 v28" fill="none"/>
    <rect x="598" y="225" width="94" height="78" rx="10" fill="#000"/>
    <circle cx="645" cy="258" r="9" fill="#fff" stroke="none"/>
    <rect x="641" y="262" width="8" height="22" fill="#fff" stroke="none"/>
  </g>
  <line x1="692" y1="250" x2="704" y2="250" stroke="#000" stroke-width="10" stroke-linecap="round"/>

  <!-- The cycle: A wants lock 2, B wants lock 1 -->
  <g stroke="#000" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M300 150 C 380 40, 560 40, 630 150" stroke-dasharray="18 14"/>
    <path d="M660 330 C 580 440, 400 440, 330 330" stroke-dasharray="18 14"/>
  </g>
  <polygon points="630,150 604,136 626,124" fill="#000"/>
  <polygon points="330,330 356,344 334,356" fill="#000"/>

  <!-- Hourglass in the middle: forever -->
  <g stroke="#000" stroke-width="7" fill="#fff" stroke-linejoin="round">
    <line x1="445" y1="185" x2="515" y2="185"/>
    <line x1="445" y1="295" x2="515" y2="295"/>
    <path d="M452 185 L 508 185 L 482 240 L 508 295 L 452 295 L 478 240 Z"/>
  </g>
  <path d="M462 285 L 498 285 L 486 262 L 474 262 Z" fill="#000"/>
</svg>
