# Kindle → Obsidian inbox: the Kindle uploads files over WebDAV into a shared
# volume, and the upstream livesync-bridge syncs that volume with the vault's
# Kindle/ folder in CouchDB (end-to-end encrypted, like the Obsidian plugin).
#
# Portainer: Stacks → Add stack → Web editor → paste this file, then set the
# variables from .env.example under "Environment variables". See README.md.
name: kindle-vault

services:
  # The bridge runs as uid 1993 (the deno user) and rclone runs as the same
  # uid, so both can write the shared inbox volume. Fresh volumes start
  # root-owned, so hand them over once before the others start.
  init-perms:
    image: busybox:1.36.1
    command: ["sh", "-c", "chown 1993:1993 /inbox"]
    volumes:
      - kindle_inbox:/inbox
    restart: "no"

  bridge:
    build:
      # vrtmrz/livesync-bridge, pinned. Bump the commit to update.
      context: https://github.com/vrtmrz/livesync-bridge.git#4f55e9ab71d055fb5f5f4488afe4b713e6668178
    image: livesync-bridge:4f55e9a
    restart: unless-stopped
    depends_on:
      init-perms:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LSB_CONFIG: /tmp/config.json
      COUCHDB_URL: ${COUCHDB_URL:-http://host.docker.internal:5984}
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
      DB_NAME: ${DB_NAME:-obsidiannotes}
      E2EE_PASSPHRASE: ${E2EE_PASSPHRASE:?set E2EE_PASSPHRASE}
      # Recent LiveSync vaults derive document/chunk IDs from an ID key: copy
      # it from the plugin ("Show current recovery code"), or the plugin
      # cannot read what the bridge writes. Empty = vault without one.
      LIVESYNC_ID_KEY: ${LIVESYNC_ID_KEY:-}
      # Must match the plugin's path obfuscation setting.
      PATH_OBFUSCATION: ${PATH_OBFUSCATION:-true}
      VAULT_FOLDER: ${VAULT_FOLDER:-Kindle/}
    # The bridge only reads a JSON file, so build it from the environment
    # (keeps secrets in Portainer's stack variables, no files to mount).
    # useRemoteTweaks pulls chunking/encryption settings from the vault itself.
    entrypoint: ["sh", "-c"]
    command:
      - |
        deno eval --quiet "
          const env = (k) => { const v = Deno.env.get(k); if (!v) { console.error('missing ' + k); Deno.exit(1); } return v; };
          const opt = (k) => (Deno.env.get(k) || '').trim();
          console.log(JSON.stringify({ peers: [
            { type: 'couchdb', name: 'vault', group: 'kindle',
              url: env('COUCHDB_URL'), database: env('DB_NAME'),
              username: env('COUCHDB_USER'), password: env('COUCHDB_PASSWORD'),
              passphrase: env('E2EE_PASSPHRASE'),
              obfuscatePassphrase: opt('PATH_OBFUSCATION') === 'false' ? '' : env('E2EE_PASSPHRASE'),
              idDerivationKey: opt('LIVESYNC_ID_KEY') || undefined,
              baseDir: env('VAULT_FOLDER'), useRemoteTweaks: true },
            { type: 'storage', name: 'inbox', group: 'kindle',
              baseDir: './data/', scanOfflineChanges: true,
              ignore: ['**/*.partial', '**/.*'] },
          ] }));
        " > /tmp/config.json && exec deno task run
    volumes:
      - kindle_inbox:/app/data
      - bridge_state:/deno-dir/location_data
    healthcheck:
      # main.ts rewrites this heartbeat every few seconds; stale or
      # restartWorthy means the bridge is wedged.
      test: ["CMD", "deno", "eval", "--quiet", "const h = JSON.parse(Deno.readTextFileSync('/tmp/lsb-health.json')); Deno.exit(Date.now() - h.ts < 120000 && !h.restartWorthy ? 0 : 1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 512m

  webdav:
    image: rclone/rclone:1.69.1
    restart: unless-stopped
    user: "1993:1993"
    depends_on:
      init-perms:
        condition: service_completed_successfully
    # Uploaders PUT to <name>.partial and then MOVE it to <name>; the bridge
    # ignores *.partial, so it never syncs a half-written file.
    command: ["serve", "webdav", "/data", "--addr", ":8080"]
    environment:
      RCLONE_USER: ${WEBDAV_USER:-kindle}
      RCLONE_PASS: ${WEBDAV_PASS:?set WEBDAV_PASS}
      RCLONE_CONFIG: /tmp/rclone.conf
      XDG_CACHE_HOME: /tmp
    ports:
      - "${WEBDAV_PORT:-8080}:8080"
    volumes:
      - kindle_inbox:/data
    mem_limit: 256m

volumes:
  kindle_inbox:
  bridge_state:
